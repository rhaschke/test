name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update
          sudo apt install -y curl gnupg dirmngr
          sudo mkdir -p /root/.gnupg
          sudo chmod 700 /root/.gnupg
          sudo curl -sSL https://ros.packages.techfak.net/gpg.key -o /etc/apt/keyrings/ros-one-keyring.gpg
          sudo gpg --no-default-keyring --keyring /etc/apt/trusted.gpg.d/custom.gpg --keyserver keyserver.ubuntu.com --recv-keys D8A3751519274DEF;
          echo "Done"
