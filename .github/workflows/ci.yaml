name: CI

on:
  push:

jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: lyrical
          UPSTREAM_WORKSPACE: github:ament/ament_index#rolling
          BEFORE_INSTALL_TARGET_DEPENDENCIES: apt policy ros-lyrical-ament-index-cpp
          AFTER_INSTALL_TARGET_DEPENDENCIES: apt policy ros-lyrical-ament-index-cpp
